[project]
name = "recallcode"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recallcode"
module-root = "src"
